<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banking App - Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
    .phone { width: 390px; min-height: 100vh; background: white; }
    .top-bar { background: #1a73e8; color: white; padding: 40px 20px 16px; }
    .top-bar h1 { font-size: 20px; }
    .top-bar p { font-size: 13px; opacity: 0.8; }
    nav { display: flex; background: white; border-bottom: 2px solid #eee; }
    nav button { flex: 1; padding: 12px; border: none; background: none; font-size: 13px; cursor: pointer; color: #666; }
    nav button.active { color: #1a73e8; border-bottom: 2px solid #1a73e8; margin-bottom: -2px; font-weight: bold; }
    .tab { display: none; padding: 20px; }
    .tab.active { display: block; }
    .balance-card { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .balance-card p { font-size: 13px; opacity: 0.8; }
    .balance-card h2 { font-size: 32px; margin-top: 4px; }
    .balance-card span { font-size: 12px; opacity: 0.7; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; }
    button.primary { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button.danger { background: #e53935; }
    button.success { background: #43a047; }
    label { font-size: 13px; color: #666; margin-bottom: 4px; display: block; }
    .result { margin-top: 16px; padding: 12px; background: #e3f2fd; border-radius: 10px; font-size: 13px; white-space: pre-wrap; }
    .result.error { background: #ffebee; color: #c62828; }
    .account-item { padding: 14px; border-bottom: 1px solid #f0f0f0; }
    .account-item h3 { font-size: 15px; }
    .account-item p { font-size: 13px; color: #888; }
    .account-item .bal { font-size: 16px; font-weight: bold; color: #1a73e8; float: right; }
    h3.section { font-size: 15px; margin-bottom: 12px; color: #333; }
  </style>
</head>
<body>
<div class="phone">
  <div class="top-bar">
    <p>Bem-vindo(a) ao</p>
    <h1>🏦 BankQA</h1>
  </div>

  <nav>
    <button class="active" onclick="switchTab('home')">🏠 Início</button>
    <button onclick="switchTab('create')">➕ Conta</button>
    <button onclick="switchTab('transfer')">🔄 Transações</button>
    <button onclick="switchTab('search')">🔍 Buscar</button>
  </nav>

  <!-- HOME -->
  <div id="tab-home" class="tab active">
    <div class="balance-card">
      <p>Saldo Total em Sistema</p>
      <h2 id="total-balance">R$ 0,00</h2>
      <span>Todas as contas ativas</span>
    </div>
    <h3 class="section">Contas Cadastradas</h3>
    <div id="accounts-list">Carregando...</div>
    <br/>
    <button class="primary" onclick="loadHome()">🔄 Atualizar</button>
  </div>

  <!-- CRIAR CONTA -->
  <div id="tab-create" class="tab">
    <h3 class="section">Nova Conta</h3>
    <label>Nome completo</label>
    <input id="m-name" placeholder="Ex: João da Silva" />
    <label>E-mail</label>
    <input id="m-email" placeholder="joao@email.com" />
    <label>CPF</label>
    <input id="m-cpf" placeholder="123.456.789-00" />
    <label>Saldo Inicial (R$)</label>
    <input id="m-balance" type="number" placeholder="0.00" />
    <button class="primary" onclick="mCreateAccount()">Criar Conta</button>
    <div id="create-result"></div>
  </div>

  <!-- TRANSFERÊNCIAS -->
  <div id="tab-transfer" class="tab">
    <h3 class="section">Depósito (Receber)</h3>
    <label>ID da Conta</label>
    <input id="m-dep-id" placeholder="ID da conta" />
    <label>Valor (R$)</label>
    <input id="m-dep-amount" type="number" placeholder="0.00" />
    <button class="primary success" onclick="mDeposit()">💰 Depositar</button>
    <br/><br/>
    <h3 class="section">Transferência (Enviar)</h3>
    <label>ID Conta Origem</label>
    <input id="m-tr-from" placeholder="ID origem" />
    <label>ID Conta Destino</label>
    <input id="m-tr-to" placeholder="ID destino" />
    <label>Valor (R$)</label>
    <input id="m-tr-amount" type="number" placeholder="0.00" />
    <button class="primary" onclick="mTransfer()">🔄 Transferir</button>
    <div id="transfer-result"></div>
  </div>

  <!-- BUSCAR -->
  <div id="tab-search" class="tab">
    <h3 class="section">Buscar Conta por ID</h3>
    <input id="m-s-id" placeholder="ID da conta" />
    <button class="primary" onclick="mGetAccount()">🔍 Buscar</button>
    <br/><br/>
    <button class="primary danger" onclick="mDelete()">🗑️ Deletar Conta</button>
    <div id="search-result"></div>
  </div>
</div>

<script>
const API = 'http://localhost:3000';

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'home') loadHome();
}

function showResult(id, data, error = false) {
  const el = document.getElementById(id);
  el.className = 'result' + (error ? ' error' : '');
  el.textContent = JSON.stringify(data, null, 2);
}

async function req(method, url, body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + url, opts);
  return { data: await res.json(), ok: res.ok };
}

async function loadHome() {
  const { data } = await req('GET', '/accounts');
  const list = document.getElementById('accounts-list');
  if (!Array.isArray(data) || data.length === 0) {
    list.innerHTML = '<p style="color:#999;text-align:center;padding:20px">Nenhuma conta cadastrada</p>';
    document.getElementById('total-balance').textContent = 'R$ 0,00';
    return;
  }
  const total = data.reduce((s, a) => s + a.balance, 0);
  document.getElementById('total-balance').textContent = `R$ ${total.toFixed(2)}`;
  list.innerHTML = data.map(a => `
    <div class="account-item">
      <span class="bal">R$ ${a.balance.toFixed(2)}</span>
      <h3>${a.name}</h3>
      <p>${a.email} | ${a.cpf}</p>
      <p style="font-size:11px;color:#bbb;margin-top:4px">${a.id}</p>
    </div>
  `).join('');
}

async function mCreateAccount() {
  const { data, ok } = await req('POST', '/accounts', {
    name: document.getElementById('m-name').value,
    email: document.getElementById('m-email').value,
    cpf: document.getElementById('m-cpf').value,
    initialBalance: parseFloat(document.getElementById('m-balance').value)
  });
  showResult('create-result', data, !ok);
}

async function mDeposit() {
  const { data, ok } = await req('POST', `/accounts/${document.getElementById('m-dep-id').value}/deposit`, {
    amount: parseFloat(document.getElementById('m-dep-amount').value)
  });
  showResult('transfer-result', data, !ok);
}

async function mTransfer() {
  const { data, ok } = await req('POST', `/accounts/${document.getElementById('m-tr-from').value}/transfer`, {
    targetId: document.getElementById('m-tr-to').value,
    amount: parseFloat(document.getElementById('m-tr-amount').value)
  });
  showResult('transfer-result', data, !ok);
}

async function mGetAccount() {
  const { data, ok } = await req('GET', `/accounts/${document.getElementById('m-s-id').value}`);
  showResult('search-result', data, !ok);
}

async function mDelete() {
  const { data, ok } = await req('DELETE', `/accounts/${document.getElementById('m-s-id').value}`);
  showResult('search-result', data, !ok);
}

loadHome();
</script>
</div>
</body>
</html>
