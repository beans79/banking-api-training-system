<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Banking App - Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; }
    header { background: #1a73e8; color: white; padding: 16px 32px; font-size: 22px; font-weight: bold; }
    .container { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { font-size: 18px; margin-bottom: 16px; color: #1a73e8; }
    input, select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; width: 100%; }
    button:hover { background: #1558b0; }
    .btn-danger { background: #e53935; }
    .btn-danger:hover { background: #b71c1c; }
    .btn-success { background: #43a047; }
    .btn-success:hover { background: #2e7d32; }
    #response { margin-top: 16px; padding: 12px; background: #e8f5e9; border-radius: 6px; font-size: 13px; white-space: pre-wrap; display: none; }
    #response.error { background: #ffebee; color: #c62828; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #1a73e8; color: white; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    tr:hover { background: #f5f5f5; }
    .full-width { grid-column: 1 / -1; }
  </style>
</head>
<body>
<header>🏦 Banking App — Desktop</header>
<div class="container">
  <div class="grid">

    <!-- Criar Conta -->
    <div class="card">
      <h2>➕ Criar Conta</h2>
      <input id="c-name" placeholder="Nome completo" />
      <input id="c-email" placeholder="E-mail" />
      <input id="c-cpf" placeholder="CPF (ex: 123.456.789-00)" />
      <input id="c-balance" type="number" placeholder="Saldo inicial (R$)" />
      <button onclick="createAccount()">Criar Conta</button>
    </div>

    <!-- Atualizar Conta -->
    <div class="card">
      <h2>✏️ Atualizar Conta</h2>
      <input id="u-id" placeholder="ID da conta" />
      <input id="u-name" placeholder="Novo nome" />
      <input id="u-email" placeholder="Novo e-mail" />
      <button onclick="updateAccount()">Atualizar</button>
    </div>

    <!-- Depositar -->
    <div class="card">
      <h2>💰 Receber Dinheiro (Depósito)</h2>
      <input id="d-id" placeholder="ID da conta" />
      <input id="d-amount" type="number" placeholder="Valor (R$)" />
      <button class="btn-success" onclick="deposit()">Depositar</button>
    </div>

    <!-- Transferir -->
    <div class="card">
      <h2>🔄 Enviar Dinheiro (Transferência)</h2>
      <input id="t-from" placeholder="ID conta origem" />
      <input id="t-to" placeholder="ID conta destino" />
      <input id="t-amount" type="number" placeholder="Valor (R$)" />
      <button onclick="transfer()">Transferir</button>
    </div>

    <!-- Buscar / Deletar -->
    <div class="card">
      <h2>🔍 Buscar / Deletar Conta</h2>
      <input id="s-id" placeholder="ID da conta" />
      <button onclick="getAccount()">Buscar</button>
      <br/><br/>
      <button class="btn-danger" onclick="deleteAccount()">Deletar Conta</button>
    </div>

    <!-- Response -->
    <div class="card">
      <h2>📋 Resposta da API</h2>
      <div id="response">—</div>
    </div>

    <!-- Lista de Contas -->
    <div class="card full-width">
      <h2>📂 Todas as Contas</h2>
      <button onclick="listAccounts()" style="width:auto;margin-bottom:16px">🔄 Atualizar Lista</button>
      <table>
        <thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>CPF</th><th>Saldo</th></tr></thead>
        <tbody id="accounts-table"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
const API = 'http://localhost:3000';

function showResponse(data, isError = false) {
  const el = document.getElementById('response');
  el.style.display = 'block';
  el.className = isError ? 'error' : '';
  el.textContent = JSON.stringify(data, null, 2);
}

async function request(method, url, body = null) {
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + url, opts);
    const data = await res.json();
    showResponse(data, !res.ok);
    return data;
  } catch (e) {
    showResponse({ error: e.message }, true);
  }
}

async function createAccount() {
  await request('POST', '/accounts', {
    name: document.getElementById('c-name').value,
    email: document.getElementById('c-email').value,
    cpf: document.getElementById('c-cpf').value,
    initialBalance: parseFloat(document.getElementById('c-balance').value)
  });
  listAccounts();
}

async function updateAccount() {
  await request('PUT', `/accounts/${document.getElementById('u-id').value}`, {
    name: document.getElementById('u-name').value,
    email: document.getElementById('u-email').value
  });
  listAccounts();
}

async function getAccount() {
  await request('GET', `/accounts/${document.getElementById('s-id').value}`);
}

async function deleteAccount() {
  await request('DELETE', `/accounts/${document.getElementById('s-id').value}`);
  listAccounts();
}

async function deposit() {
  await request('POST', `/accounts/${document.getElementById('d-id').value}/deposit`, {
    amount: parseFloat(document.getElementById('d-amount').value)
  });
  listAccounts();
}

async function transfer() {
  await request('POST', `/accounts/${document.getElementById('t-from').value}/transfer`, {
    targetId: document.getElementById('t-to').value,
    amount: parseFloat(document.getElementById('t-amount').value)
  });
  listAccounts();
}

async function listAccounts() {
  const data = await request('GET', '/accounts');
  const tbody = document.getElementById('accounts-table');
  if (!Array.isArray(data)) return;
  tbody.innerHTML = data.map(a =>
    `<tr><td title="${a.id}">${a.id.substring(0,8)}...</td><td>${a.name}</td><td>${a.email}</td><td>${a.cpf}</td><td>R$ ${a.balance.toFixed(2)}</td></tr>`
  ).join('');
}

listAccounts();
</script>
</body>
</html>
